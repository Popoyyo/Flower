<!DOCTYPE html>
<html>
<head>
    <title>8 Petal Flower</title>
    <link rel="stylesheet" href="petals.css">
</head>

<body>

<div class="main-container">

    <div class="flower-wrapper">

        <div class="flower" id="flower">

            <div class="flower-center"></div>

            <button class="petal petal-1" onclick="showPanel(1)">Petal 1</button>
            <button class="petal petal-2" onclick="showPanel(2)">Petal 2</button>
            <button class="petal petal-3" onclick="showPanel(3)">Petal 3</button>
            <button class="petal petal-4" onclick="showPanel(4)">Petal 4</button>
            <button class="petal petal-5" onclick="showPanel(5)">Petal 5</button>
            <button class="petal petal-6" onclick="showPanel(6)">Petal 6</button>
            <button class="petal petal-7" onclick="showPanel(7)">Petal 7</button>
            <button class="petal petal-8" onclick="showPanel(8)">Petal 8</button>

        </div>

    </div>

    <div class="content-area">

        <button class="content-panel panel-1" onclick="panelClick(1)">
            <img src="sad.jpg" alt="">
        </button>

        <button class="content-panel panel-2" onclick="panelClick(2)">
            <img src="placeholder2.png" alt="">
        </button>

        <button class="content-panel panel-3" onclick="panelClick(3)">
            <img src="placeholder3.png" alt="">
        </button>

        <button class="content-panel panel-4" onclick="panelClick(4)">
            <img src="placeholder4.png" alt="">
        </button>

        <button class="content-panel panel-5" onclick="panelClick(5)">
            <img src="placeholder5.png" alt="">
        </button>

        <button class="content-panel panel-6" onclick="panelClick(6)">
            <img src="placeholder6.png" alt="">
        </button>

        <button class="content-panel panel-7" onclick="panelClick(7)">
            <img src="placeholder7.png" alt="">
        </button>

        <button class="content-panel panel-8" onclick="panelClick(8)">
            <img src="placeholder8.png" alt="">
        </button>

    </div>

</div>

<script src="petals.js"></script>

</body>
</html>
