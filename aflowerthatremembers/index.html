<!DOCTYPE html>
<html>
<head>
    <title>8 Petal Flower</title>
    <link rel="stylesheet" href="petals.css">
</head>

<body>

<!-- =========================================
     OUTER CONTAINER
     ========================================= -->

<div class="flower-wrapper">

    <!-- =====================================
         FLOWER
         ===================================== -->

    <div class="flower" id="flower">

        <!-- GREEN CENTER -->
        <div class="flower-center"></div>


        <!-- GREEN STEMS -->
        <div class="stem stem-1"></div>
        <div class="stem stem-2"></div>
        <div class="stem stem-3"></div>
        <div class="stem stem-4"></div>
        <div class="stem stem-5"></div>
        <div class="stem stem-6"></div>
        <div class="stem stem-7"></div>
        <div class="stem stem-8"></div>


        <!-- =================================
             8 PETAL BUTTONS
             ================================= -->

        <button
            class="petal petal-1"
            onclick="showPanel(1)">
            Petal 1
        </button>

        <button
            class="petal petal-2"
            onclick="showPanel(2)">
            Petal 2
        </button>

        <button
            class="petal petal-3"
            onclick="showPanel(3)">
            Petal 3
        </button>

        <button
            class="petal petal-4"
            onclick="showPanel(4)">
            Petal 4
        </button>

        <button
            class="petal petal-5"
            onclick="showPanel(5)">
            Petal 5
        </button>

        <button
            class="petal petal-6"
            onclick="showPanel(6)">
            Petal 6
        </button>

        <button
            class="petal petal-7"
            onclick="showPanel(7)">
            Petal 7
        </button>

        <button
            class="petal petal-8"
            onclick="showPanel(8)">
            Petal 8
        </button>


        <!-- =================================
             PLACEHOLDER CONTENT
             ================================= -->

        <div class="display-panel panel-1">
            Content for Petal 1
        </div>

        <div class="display-panel panel-2">
            Content for Petal 2
        </div>

        <div class="display-panel panel-3">
            Content for Petal 3
        </div>

        <div class="display-panel panel-4">
            Content for Petal 4
        </div>

        <div class="display-panel panel-5">
            Content for Petal 5
        </div>

        <div class="display-panel panel-6">
            Content for Petal 6
        </div>

        <div class="display-panel panel-7">
            Content for Petal 7
        </div>

        <div class="display-panel panel-8">
            Content for Petal 8
        </div>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script>

let openedPetal = null;


/* =========================================
   PETAL CLICK
   ========================================= */

function showPanel(number) {

    const flower =
        document.querySelector(".flower");

    const selectedPanel =
        document.querySelector(".panel-" + number);


    /* =====================================
       IF ANOTHER PETAL IS OPEN
       DO NOTHING
       ===================================== */

    if (
        openedPetal !== null &&
        openedPetal !== number
    ) {
        return;
    }


    /* =====================================
       CLICK SAME PETAL
       CLOSE + CENTER
       ===================================== */

    if (openedPetal === number) {

        selectedPanel.classList.remove("show");

        flower.style.transform =
            "translate(-50%, -50%)";

        openedPetal = null;

        return;
    }


    /* =====================================
       OPEN PANEL
       ===================================== */

    selectedPanel.classList.add("show");

    openedPetal = number;


    /* =====================================
       MOVE FLOWER
       ===================================== */

    let x = 0;
    let y = 0;


    /*
       How far the flower moves.

       Increase this number if you want
       the movement to be stronger.
    */

    const distance = 300;


    /* =====================================
       PETAL DIRECTIONS
       ===================================== */

    switch (number) {

        /* TOP PETAL */
        case 1:
            x = 0;
            y = distance;
            break;


        /* TOP RIGHT */
        case 2:
            x = -distance;
            y = distance;
            break;


        /* RIGHT */
        case 3:
            x = -distance;
            y = 0;
            break;


        /* BOTTOM RIGHT */
        case 4:
            x = -distance;
            y = -distance;
            break;


        /* BOTTOM */
        case 5:
            x = 0;
            y = -distance;
            break;


        /* BOTTOM LEFT */
        case 6:
            x = distance;
            y = -distance;
            break;


        /* LEFT */
        case 7:
            x = distance;
            y = 0;
            break;


        /* TOP LEFT */
        case 8:
            x = distance;
            y = distance;
            break;
    }


    /* =====================================
       MOVE WHOLE FLOWER
       ===================================== */

    flower.style.transform =
        "translate(-50%, -50%) " +
        "translate(" +
        x +
        "px, " +
        y +
        "px)";
}

</script>


</body>
</html>
