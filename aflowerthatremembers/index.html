<!DOCTYPE html>
<html>
<head>
    <title>8 Petal Flower</title>
    <link rel="stylesheet" href="petals.css">
</head>

<body>

<!-- =========================================
     OUTER CONTAINER
     ========================================= -->

<div class="flower-wrapper">

    <!-- =====================================
         FLOWER
         ===================================== -->

    <div class="flower" id="flower">

        <!-- GREEN CENTER -->
        <div class="flower-center"></div>


        <!-- GREEN STEMS -->
        <div class="stem stem-1"></div>
        <div class="stem stem-2"></div>
        <div class="stem stem-3"></div>
        <div class="stem stem-4"></div>
        <div class="stem stem-5"></div>
        <div class="stem stem-6"></div>
        <div class="stem stem-7"></div>
        <div class="stem stem-8"></div>


        <!-- =================================
             8 PETAL BUTTONS
             ================================= -->

        <button
            class="petal petal-1"
            onclick="showPanel(1)">
            Petal 1
        </button>

        <button
            class="petal petal-2"
            onclick="showPanel(2)">
            Petal 2
        </button>

        <button
            class="petal petal-3"
            onclick="showPanel(3)">
            Petal 3
        </button>

        <button
            class="petal petal-4"
            onclick="showPanel(4)">
            Petal 4
        </button>

        <button
            class="petal petal-5"
            onclick="showPanel(5)">
            Petal 5
        </button>

        <button
            class="petal petal-6"
            onclick="showPanel(6)">
            Petal 6
        </button>

        <button
            class="petal petal-7"
            onclick="showPanel(7)">
            Petal 7
        </button>

        <button
            class="petal petal-8"
            onclick="showPanel(8)">
            Petal 8
        </button>


        <!-- =================================
             PLACEHOLDER CONTENT
             ================================= -->

        <div class="display-panel panel-1">
            Content for Petal 1
        </div>

        <div class="display-panel panel-2">
            Content for Petal 2
        </div>

        <div class="display-panel panel-3">
            Content for Petal 3
        </div>

        <div class="display-panel panel-4">
            Content for Petal 4
        </div>

        <div class="display-panel panel-5">
            Content for Petal 5
        </div>

        <div class="display-panel panel-6">
            Content for Petal 6
        </div>

        <div class="display-panel panel-7">
            Content for Petal 7
        </div>

        <div class="display-panel panel-8">
            Content for Petal 8
        </div>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script>

function showPanel(number) {

    const wrapper =
        document.querySelector(".flower-wrapper");

    const flower =
        document.querySelector(".flower");

    const selectedPanel =
        document.querySelector(".panel-" + number);


    /* =====================================
       CHECK IF ANOTHER PANEL IS OPEN
       ===================================== */

    const openPanel =
        document.querySelector(".display-panel.show");


    /* =====================================
       ANOTHER PETAL IS OPEN
       DO NOTHING
       ===================================== */

    if (openPanel && openPanel !== selectedPanel) {
        return;
    }


    /* =====================================
       CLOSE CURRENT PETAL
       ===================================== */

    if (selectedPanel.classList.contains("show")) {

        selectedPanel.classList.remove("show");

        flower.style.transform =
            "translate(-50%, -50%)";

        return;
    }


    /* =====================================
       RESET FLOWER BEFORE CALCULATING
       ===================================== */

    flower.style.transform =
        "translate(-50%, -50%)";


    /* =====================================
       SHOW PANEL
       ===================================== */

    selectedPanel.classList.add("show");


    /*
       Wait for the panel to become visible.
    */

    requestAnimationFrame(function() {

        /*
           Get the actual phone viewport.
        */

        const wrapperRect =
            wrapper.getBoundingClientRect();


        /*
           Get the actual position of the
           selected placeholder.
        */

        const panelRect =
            selectedPanel.getBoundingClientRect();


        /* =================================
           SCREEN CENTER
           ================================= */

        const screenCenterX =
            wrapperRect.left +
            wrapperRect.width / 2;

        const screenCenterY =
            wrapperRect.top +
            wrapperRect.height / 2;


        /* =================================
           PANEL CENTER
           ================================= */

        const panelCenterX =
            panelRect.left +
            panelRect.width / 2;

        const panelCenterY =
            panelRect.top +
            panelRect.height / 2;


        /* =================================
           HOW FAR PANEL IS FROM SCREEN CENTER
           ================================= */

        const moveX =
            screenCenterX - panelCenterX;

        const moveY =
            screenCenterY - panelCenterY;


        /* =================================
           GET CURRENT FLOWER POSITION
           ================================= */

        const flowerRect =
            flower.getBoundingClientRect();


        /*
           Because the flower's transform uses
           translate(-50%, -50%), compensate for
           the existing centered position.
        */

        const currentTransform =
            flower.style.transform;


        /* =================================
           MOVE THE WHOLE FLOWER
           ================================= */

        flower.style.transform =
            "translate(calc(-50% + " +
            moveX +
            "px), calc(-50% + " +
            moveY +
            "px))";

    });

}

</script>

</body>
</html>
