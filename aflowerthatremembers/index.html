<!DOCTYPE html>
<html>
<head>
    <title>8 Petal Flower</title>
    <link rel="stylesheet" href="petals.css">
</head>

<body>

<div class="main-container">

    <div class="flower-wrapper">

        <div class="flower" id="flower">

            <div class="flower-center"></div>

            <div class="stem stem-1"></div>
            <div class="stem stem-2"></div>
            <div class="stem stem-3"></div>
            <div class="stem stem-4"></div>
            <div class="stem stem-5"></div>
            <div class="stem stem-6"></div>
            <div class="stem stem-7"></div>
            <div class="stem stem-8"></div>

            <button class="petal petal-1" onclick="showPanel(1)">Petal 1</button>
            <button class="petal petal-2" onclick="showPanel(2)">Petal 2</button>
            <button class="petal petal-3" onclick="showPanel(3)">Petal 3</button>
            <button class="petal petal-4" onclick="showPanel(4)">Petal 4</button>
            <button class="petal petal-5" onclick="showPanel(5)">Petal 5</button>
            <button class="petal petal-6" onclick="showPanel(6)">Petal 6</button>
            <button class="petal petal-7" onclick="showPanel(7)">Petal 7</button>
            <button class="petal petal-8" onclick="showPanel(8)">Petal 8</button>

        </div>

    </div>

    <div class="content-area">

        <div class="content-panel panel-1">
            PNG PLACEHOLDER 1
        </div>

        <div class="content-panel panel-2">
            PNG PLACEHOLDER 2
        </div>

        <div class="content-panel panel-3">
            PNG PLACEHOLDER 3
        </div>

        <div class="content-panel panel-4">
            PNG PLACEHOLDER 4
        </div>

        <div class="content-panel panel-5">
            PNG PLACEHOLDER 5
        </div>

        <div class="content-panel panel-6">
            PNG PLACEHOLDER 6
        </div>

        <div class="content-panel panel-7">
            PNG PLACEHOLDER 7
        </div>

        <div class="content-panel panel-8">
            PNG PLACEHOLDER 8
        </div>

    </div>

</div>

<script src="petals.js"></script>

</body>
</html>
