<!DOCTYPE html>
<html>
<head>
    <title>8 Petal Flower</title>
    <link rel="stylesheet" href="petals.css">
</head>

<body>

<!-- =========================================
     OUTER CONTAINER
     ========================================= -->

<div class="flower-wrapper">

    <!-- =====================================
         FLOWER
         ===================================== -->

    <div class="flower" id="flower">

        <!-- GREEN CENTER -->
        <div class="flower-center"></div>


        <!-- GREEN STEMS -->
        <div class="stem stem-1"></div>
        <div class="stem stem-2"></div>
        <div class="stem stem-3"></div>
        <div class="stem stem-4"></div>
        <div class="stem stem-5"></div>
        <div class="stem stem-6"></div>
        <div class="stem stem-7"></div>
        <div class="stem stem-8"></div>


        <!-- =================================
             8 PETAL BUTTONS
             ================================= -->

        <button
            class="petal petal-1"
            onclick="showPanel(1)">
            Petal 1
        </button>

        <button
            class="petal petal-2"
            onclick="showPanel(2)">
            Petal 2
        </button>

        <button
            class="petal petal-3"
            onclick="showPanel(3)">
            Petal 3
        </button>

        <button
            class="petal petal-4"
            onclick="showPanel(4)">
            Petal 4
        </button>

        <button
            class="petal petal-5"
            onclick="showPanel(5)">
            Petal 5
        </button>

        <button
            class="petal petal-6"
            onclick="showPanel(6)">
            Petal 6
        </button>

        <button
            class="petal petal-7"
            onclick="showPanel(7)">
            Petal 7
        </button>

        <button
            class="petal petal-8"
            onclick="showPanel(8)">
            Petal 8
        </button>


        <!-- =================================
             PLACEHOLDER CONTENT
             ================================= -->

        <div class="display-panel panel-1">
            Content for Petal 1
        </div>

        <div class="display-panel panel-2">
            Content for Petal 2
        </div>

        <div class="display-panel panel-3">
            Content for Petal 3
        </div>

        <div class="display-panel panel-4">
            Content for Petal 4
        </div>

        <div class="display-panel panel-5">
            Content for Petal 5
        </div>

        <div class="display-panel panel-6">
            Content for Petal 6
        </div>

        <div class="display-panel panel-7">
            Content for Petal 7
        </div>

        <div class="display-panel panel-8">
            Content for Petal 8
        </div>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script>

let openedPetal = null;


/* =========================================
   SHOW / HIDE PANEL
   ========================================= */

function showPanel(number) {

    const flower =
        document.querySelector(".flower");

    const selectedPanel =
        document.querySelector(".panel-" + number);


    /* =====================================
       IF A PETAL IS ALREADY OPEN
       ===================================== */

    if (openedPetal !== null) {

        /* If clicking the SAME petal -> close it */

        if (openedPetal === number) {

            selectedPanel.classList.remove("show");

            flower.style.transform =
                "translate(-50%, -50%)";

            openedPetal = null;

            return;
        }


        /*
           Another petal is already open.
           Do nothing.
        */

        return;
    }


    /* =====================================
       REMEMBER WHICH PETAL IS OPEN
       ===================================== */

    openedPetal = number;


    /* =====================================
       SHOW THE PANEL
       ===================================== */

    selectedPanel.classList.add("show");


    /*
       Wait until the panel has been displayed
       and its position can be measured.
    */

    requestAnimationFrame(function() {

        requestAnimationFrame(function() {

            centerPanel(
                flower,
                selectedPanel
            );

        });

    });

}


/* =========================================
   CENTER SELECTED PANEL ON SCREEN
   ========================================= */

function centerPanel(flower, panel) {

    const panelRect =
        panel.getBoundingClientRect();


    /* =====================================
       ACTUAL CENTER OF THE PHONE SCREEN
       ===================================== */

    const screenCenterX =
        window.innerWidth / 2;

    const screenCenterY =
        window.innerHeight / 2;


    /* =====================================
       ACTUAL CENTER OF THE PANEL
       ===================================== */

    const panelCenterX =
        panelRect.left +
        (panelRect.width / 2);

    const panelCenterY =
        panelRect.top +
        (panelRect.height / 2);


    /* =====================================
       DISTANCE PANEL NEEDS TO MOVE
       ===================================== */

    const moveX =
        screenCenterX -
        panelCenterX;

    const moveY =
        screenCenterY -
        panelCenterY;


    /* =====================================
       MOVE THE WHOLE FLOWER
       ===================================== */

    flower.style.transform =
        "translate(-50%, -50%) " +
        "translate(" +
        moveX +
        "px, " +
        moveY +
        "px)";

}


/* =========================================
   HANDLE PHONE ROTATION / RESIZE
   ========================================= */

window.addEventListener("resize", function() {

    if (openedPetal === null) {
        return;
    }


    const flower =
        document.querySelector(".flower");

    const panel =
        document.querySelector(
            ".panel-" + openedPetal
        );


    /*
       Reset first so we don't calculate
       from the previous camera position.
    */

    flower.style.transform =
        "translate(-50%, -50%)";


    requestAnimationFrame(function() {

        requestAnimationFrame(function() {

            centerPanel(
                flower,
                panel
            );

        });

    });

});

</script>

</body>
</html>
