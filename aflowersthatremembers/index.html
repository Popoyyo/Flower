<!DOCTYPE html>
<html>
<head>
    <title>8 Petal Flower</title>
    <link rel="stylesheet" href="petals.css">
</head>

<body>

<!-- =========================================
     OUTER CONTAINER
     ========================================= -->

<div class="flower-wrapper">

    <!-- =====================================
         FLOWER
         ===================================== -->

    <div class="flower" id="flower">

        <!-- GREEN CENTER -->
        <div class="flower-center"></div>


        <!-- GREEN STEMS -->
        <div class="stem stem-1"></div>
        <div class="stem stem-2"></div>
        <div class="stem stem-3"></div>
        <div class="stem stem-4"></div>
        <div class="stem stem-5"></div>
        <div class="stem stem-6"></div>
        <div class="stem stem-7"></div>
        <div class="stem stem-8"></div>


        <!-- =================================
             8 PETAL BUTTONS
             ================================= -->

        <button
            class="petal petal-1"
            onclick="showPanel(1)">
            Petal 1
        </button>

        <button
            class="petal petal-2"
            onclick="showPanel(2)">
            Petal 2
        </button>

        <button
            class="petal petal-3"
            onclick="showPanel(3)">
            Petal 3
        </button>

        <button
            class="petal petal-4"
            onclick="showPanel(4)">
            Petal 4
        </button>

        <button
            class="petal petal-5"
            onclick="showPanel(5)">
            Petal 5
        </button>

        <button
            class="petal petal-6"
            onclick="showPanel(6)">
            Petal 6
        </button>

        <button
            class="petal petal-7"
            onclick="showPanel(7)">
            Petal 7
        </button>

        <button
            class="petal petal-8"
            onclick="showPanel(8)">
            Petal 8
        </button>


        <!-- =================================
             PLACEHOLDER CONTENT
             ================================= -->

        <div class="display-panel panel-1">
            Content for Petal 1
        </div>

        <div class="display-panel panel-2">
            Content for Petal 2
        </div>

        <div class="display-panel panel-3">
            Content for Petal 3
        </div>

        <div class="display-panel panel-4">
            Content for Petal 4
        </div>

        <div class="display-panel panel-5">
            Content for Petal 5
        </div>

        <div class="display-panel panel-6">
            Content for Petal 6
        </div>

        <div class="display-panel panel-7">
            Content for Petal 7
        </div>

        <div class="display-panel panel-8">
            Content for Petal 8
        </div>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script>

function showPanel(number) {

    const wrapper =
        document.querySelector(".flower-wrapper");

    const flower =
        document.querySelector(".flower");

    const selectedPanel =
        document.querySelector(".panel-" + number);


    /* =====================================
       CHECK IF A PETAL IS ALREADY OPEN
       ===================================== */

    const openPanel =
        document.querySelector(".display-panel.show");


    /* =====================================
       IF ANOTHER PETAL IS OPEN
       
       DO NOTHING.
       
       User must close the current petal
       before opening another one.
       ===================================== */

    if (openPanel && openPanel !== selectedPanel) {
        return;
    }


    /* =====================================
       CLOSE CURRENT PETAL
       ===================================== */

    if (selectedPanel.classList.contains("show")) {

        selectedPanel.classList.remove("show");

        /* Return flower to center */

        flower.style.transform =
            "translate(0px, 0px)";

        return;
    }


    /* =====================================
       SHOW SELECTED PANEL
       ===================================== */

    selectedPanel.classList.add("show");


    /* =====================================
       WAIT FOR PANEL TO APPEAR
       ===================================== */

    requestAnimationFrame(function() {

        const wrapperRect =
            wrapper.getBoundingClientRect();

        const panelRect =
            selectedPanel.getBoundingClientRect();


        /* =================================
           CENTER OF PHONE SCREEN
           ================================= */

        const screenCenterX =
            wrapperRect.width / 2;

        const screenCenterY =
            wrapperRect.height / 2;


        /* =================================
           CENTER OF PLACEHOLDER
           ================================= */

        const panelCenterX =
            panelRect.left +
            panelRect.width / 2 -
            wrapperRect.left;

        const panelCenterY =
            panelRect.top +
            panelRect.height / 2 -
            wrapperRect.top;


        /* =================================
           CALCULATE FLOWER MOVEMENT
           ================================= */

        const moveX =
            screenCenterX - panelCenterX;

        const moveY =
            screenCenterY - panelCenterY;


        /* =================================
           MOVE WHOLE FLOWER
           ================================= */

        flower.style.transform =
            "translate(" +
            moveX +
            "px, " +
            moveY +
            "px)";

    });

}

</script>

</body>
</html>
